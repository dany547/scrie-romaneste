name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rulează testele
        run: python -m unittest discover -s tests -v

      - name: Verifică scripturile pe propriile fixtures
        run: |
          python scripts/check-tipare.py tests/fixtures/bun-articol.md
          python scripts/check-ritm.py tests/fixtures/bun-articol.md
          python scripts/check-seo.py tests/fixtures/bun-articol.md
